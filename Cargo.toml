[workspace]
resolver = "2"
members = [
    "botbowl-engine",
    "botbowl-curriculum",
    "botbowl-mcts",
    "botbowl-ui",
    "botbowl-play",
    "botbowl-hub-proto",
    "botbowl-hub",
    "botbowl-worker",
    "botbowl-data",
    "botbowl-nn",
    "botbowl-web/proto",
    "botbowl-web/server",
    "botbowl-web/client",
]
# recon_mcts is its own nested workspace (library + tests/nim, the latter
# compiled with `test_internals` by default). Exclude it so it stays a
# separate workspace root; botbowl-mcts depends on it via path dependency.
exclude = ["recon_mcts"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Versions shared by several members, so they cannot drift apart. A member names the dependency
# with `workspace = true` and adds its own `features` on top (features are additive; a member
# cannot remove one set here, so these carry only what every user needs).
[workspace.dependencies]
botbowl-engine = { version = "0.1.0", path = "botbowl-engine" }
botbowl-curriculum = { version = "0.1.0", path = "botbowl-curriculum" }
botbowl-mcts = { version = "0.1.0", path = "botbowl-mcts" }
botbowl-data = { version = "0.1.0", path = "botbowl-data" }
botbowl-nn = { version = "0.1.0", path = "botbowl-nn" }
botbowl-play = { version = "0.1.0", path = "botbowl-play" }
botbowl-hub-proto = { version = "0.1.0", path = "botbowl-hub-proto" }
botbowl-worker = { version = "0.1.0", path = "botbowl-worker" }
botbowl-web-proto = { version = "0.1.0", path = "botbowl-web/proto" }
botbowl-web-server = { version = "0.1.0", path = "botbowl-web/server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
rand = "0.8.5"
rand_chacha = "0.3"
toml = "0.8"
tokio = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
axum = { version = "0.8", features = ["ws"] }
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
mimalloc = "0.1"

# Debug builds optimise the hot crates: MCTS tests run the search thousands of times, and
# unoptimised engine/search code made them the slowest part of `cargo test`. Debug info and
# debug assertions stay on; only these three crates are affected.
[profile.dev.package.botbowl-engine]
opt-level = 2
[profile.dev.package.botbowl-mcts]
opt-level = 2
[profile.dev.package.recon_mcts]
opt-level = 2

# `cargo build --profile profiling` — release code with full debug info for samply/perf, in its
# own `target/profiling/` so profiling never invalidates the release build (as RUSTFLAGS did).
[profile.profiling]
inherits = "release"
debug = 2
