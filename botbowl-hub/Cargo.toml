[package]
name = "botbowl-hub"
version.workspace = true
edition.workspace = true
description = "Job queue and result sink for distributed generation/eval (plan 041)"

[dependencies]
botbowl-hub-proto = { workspace = true }
botbowl-play = { workspace = true }
botbowl-engine = { workspace = true }
botbowl-mcts = { workspace = true }
botbowl-data = { workspace = true }
botbowl-curriculum = { workspace = true }
# The web play app, served under /play/.
botbowl-web-server = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
botbowl-worker = { workspace = true }
tokio-tungstenite = { workspace = true }
# `ServiceExt::oneshot`, to drive the router with a chosen peer address (the allow-from gate's test).
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "botbowl-hub"
path = "src/main.rs"
