[package]
name = "botbowl-hub"
version = "0.1.0"
edition = "2021"
description = "Job queue and result sink for distributed generation/eval (plan 041)"

[dependencies]
botbowl-hub-proto = { version = "0.1.0", path = "../botbowl-hub-proto/" }
botbowl-play = { version = "0.1.0", path = "../botbowl-play/" }
botbowl-engine = { version = "0.1.0", path = "../botbowl-engine/" }
botbowl-mcts = { version = "0.1.0", path = "../botbowl-mcts/" }
botbowl-data = { version = "0.1.0", path = "../botbowl-data/" }
botbowl-curriculum = { version = "0.1.0", path = "../botbowl-curriculum/" }
# The web play app, served under /play/.
botbowl-web-server = { version = "0.1.0", path = "../botbowl-web/server/" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
zstd = "0.13"
# The registry pages (`/registry`): GitHub-flavoured markdown, tables included.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Local wall-clock times on the status page and in the hub.log rate lines.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
botbowl-worker = { version = "0.1.0", path = "../botbowl-worker/" }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
# `ServiceExt::oneshot`, to drive the router with a chosen peer address (the allow-from gate's test).
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "botbowl-hub"
path = "src/main.rs"
