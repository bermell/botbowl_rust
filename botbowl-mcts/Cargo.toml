[package]
name = "botbowl-mcts"
version.workspace = true
edition.workspace = true

[dependencies]
botbowl-engine = { workspace = true }
botbowl-data = { workspace = true }
botbowl-nn = { workspace = true }
recon_mcts = { version = "0.1.0", path = "../recon_mcts/", features = ["lockref-guard"] }
serde = { workspace = true }
# Plan 048: root Dirichlet noise in self-play (`exploration.rs`).
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = "0.4"

[features]
# Opt-in gate for the heavy profiling benches in `tests/expand_bench.rs`.
# OFF by default so the routine `cargo test --release -- --ignored` (the
# ~2 min bot benchmark suite) does NOT sweep them up — they are minutes-long,
# many-thread, high-memory profiling runs, not part of that suite. Run them
# explicitly with:
#   cargo test --release -p botbowl-mcts --features expand_bench \
#       --test expand_bench -- --ignored --nocapture
expand_bench = []
# A no-op since plan 070 (recon_mcts hashes its containers with a fixed hasher in every build);
# kept because `scripts/perf_search_bench.sh` builds `botbowl-ui --features deterministic_hash`.
deterministic_hash = ["recon_mcts/deterministic_hash"]

[dev-dependencies]
botbowl-curriculum = { workspace = true }
# Unions with the `dependencies` recon_mcts feature set for test targets only
# (resolver = "2" keeps this out of the lib build) — plan 023's exact-equality
# search-mirror test needs reproducible children-map iteration order.
recon_mcts = { version = "0.1.0", path = "../recon_mcts/", features = ["deterministic_hash"] }
