[package]
name = "botbowl-play"
version.workspace = true
edition.workspace = true
description = "Play one game and return its record: the shared core under `botbowl-ui dataset`/`eval` and the plan-041 worker"

[features]
# `cli_args`: the `dataset`/`eval` clap structs `botbowl-ui` and `botbowl-hub` share (plan 059).
# Off by default so the library, the worker and the web server stay clap-free.
cli = ["dep:clap"]

[dependencies]
botbowl-curriculum = { workspace = true }
botbowl-data = { workspace = true }
botbowl-engine = { workspace = true }
botbowl-mcts = { workspace = true }
botbowl-nn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Bot presets (plan 043) are TOML: a committable file that reads as a list of knobs.
toml = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
postcard = { workspace = true }
# So `cargo test -p botbowl-play` runs the `cli_args` tests too.
botbowl-play = { path = ".", features = ["cli"] }
