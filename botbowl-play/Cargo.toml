[package]
name = "botbowl-play"
version = "0.1.0"
edition = "2021"
description = "Play one game and return its record: the shared core under `botbowl-ui dataset`/`eval` and the plan-041 worker"

[dependencies]
botbowl-curriculum = { version = "0.1.0", path = "../botbowl-curriculum/" }
botbowl-data = { version = "0.1.0", path = "../botbowl-data/" }
botbowl-engine = { version = "0.1.0", path = "../botbowl-engine/" }
botbowl-mcts = { version = "0.1.0", path = "../botbowl-mcts/" }
botbowl-nn = { version = "0.1.0", path = "../botbowl-nn/" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bot presets (plan 043) are TOML: a committable file that reads as a list of knobs.
toml = "0.8"
rand = "0.8.5"
rand_chacha = "0.3"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
