[package]
name = "botbowl-ui"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
botbowl-curriculum = { workspace = true }
botbowl-data = { workspace = true }
botbowl-engine = { workspace = true }
botbowl-mcts = { workspace = true }
botbowl-nn = { workspace = true }
botbowl-play = { workspace = true, features = ["cli"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossterm = "0.27.0"
rand = { workspace = true }
rand_chacha = { workspace = true }
ratatui = "0.25.0"
# Global allocator, as in botbowl-worker: `dataset`/`eval` play many MCTS games per process and
# glibc malloc keeps the freed trees in per-thread arenas.
mimalloc = { workspace = true }

[features]
# Reproducible search for benchmarks only (`scripts/perf_search_bench.sh`).
deterministic_hash = ["botbowl-mcts/deterministic_hash"]

[dev-dependencies]
insta = "1"
# `tests/mc_label_hub.rs` (plan 062): the hub's `job label` against this crate's `mc-label`.
botbowl-hub = { path = "../botbowl-hub" }
botbowl-hub-proto = { workspace = true }
botbowl-worker = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
zstd = { workspace = true }
