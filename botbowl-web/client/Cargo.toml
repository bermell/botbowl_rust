[package]
name = "botbowl-web-client"
version.workspace = true
edition.workspace = true
description = "Leptos (CSR) wasm client for playing Blood Bowl against the workspace bots in a browser."

[dependencies]
botbowl-web-proto = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Window",
    "WebSocket",
] }
