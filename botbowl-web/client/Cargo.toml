[package]
name = "botbowl-web-client"
version = "0.1.0"
edition = "2021"
description = "Leptos (CSR) wasm client for playing Blood Bowl against the workspace bots in a browser."

[dependencies]
botbowl-web-proto = { version = "0.1.0", path = "../proto" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Window",
    "WebSocket",
] }
