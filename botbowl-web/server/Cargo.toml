[package]
name = "botbowl-web-server"
version = "0.1.0"
edition = "2021"
description = "axum server that owns the GameState and the bots, and streams a derived ViewState to the wasm client over one websocket per game."

[dependencies]
botbowl-web-proto = { version = "0.1.0", path = "../proto" }
botbowl-engine = { version = "0.1.0", path = "../../botbowl-engine/" }
botbowl-mcts = { version = "0.1.0", path = "../../botbowl-mcts/" }
botbowl-nn = { version = "0.1.0", path = "../../botbowl-nn/" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
# Websocket *client*, for the integration test that plays a whole game over
# the wire. No TLS: the server binds 127.0.0.1 only.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[[bin]]
name = "botbowl-web-server"
path = "src/main.rs"
