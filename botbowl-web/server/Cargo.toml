[package]
name = "botbowl-web-server"
version.workspace = true
edition.workspace = true
description = "axum server that owns the GameState and the bots, and streams a derived ViewState to the wasm client over one websocket per game."

[dependencies]
botbowl-web-proto = { workspace = true }
botbowl-engine = { workspace = true }
botbowl-mcts = { workspace = true }
botbowl-nn = { workspace = true }
# Random-start drives: the corpus's own position draw.
botbowl-play = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
base64 = "0.22"
toml = { workspace = true }
# The worker's model cache layout and the hub's names for its nets (`ModelMeta`).
botbowl-hub-proto = { workspace = true }

[dev-dependencies]
# Websocket *client*, for the integration test that plays a whole game over
# the wire. No TLS: the server binds 127.0.0.1 only.
tokio-tungstenite = { workspace = true }

[[bin]]
name = "botbowl-web-server"
path = "src/main.rs"
