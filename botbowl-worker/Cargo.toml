[package]
name = "botbowl-worker"
version.workspace = true
edition.workspace = true
description = "Dials a botbowl-hub and plays the games it hands out (plan 041)"

[dependencies]
botbowl-hub-proto = { workspace = true }
botbowl-data = { workspace = true }
botbowl-play = { workspace = true }
botbowl-engine = { workspace = true }
botbowl-mcts = { workspace = true }
botbowl-nn = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
# Global allocator: glibc malloc keeps freed MCTS trees in per-thread arenas (a worker sat at
# ~12 GB RSS idle and its memory governor deadlocked), mimalloc returns them to the OS.
mimalloc = { workspace = true }

[[bin]]
name = "botbowl-worker"
path = "src/main.rs"
