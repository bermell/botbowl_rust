# Plan 070: `chance_all_partial` as it searched before plan 070, for A/B runs against the new
# search in one binary. `backprop = "legacy"`: a descent does not back up the parent of a twin it
# spliced in, so that parent keeps a value that ignores its new child until a later backup passes
# through it. (The other plan-070 changes only reorder exact ties, which `tie_break = "hash"`
# leaves to the children map's order anyway.)
budget_mode = "iterations"
gumbel_m = 16
gumbel_q_floor = 1000
bounce_model = "catch"
pass_scatter_model = "grouped"
throw_in_model = "grouped"
chance_backup = "partial"
backprop = "legacy"
