[package]
name = "recon_mcts"
description = "A recombining, concurrent implementation of monte carlo tree search"
version = "0.1.0"
authors = ["trtsl@github.com"]
edition = "2018"
license = "MIT"
readme = "README.md"

[features]
default = ["stable"]
stable = []
test_internals = []
nightly = []
two_player = []
# Opt-in debug-build guard against the chained-`lockref::Ref` pattern that
# produced the original parallel deadlock (see plan 013). When enabled,
# `lockref::Ref::new` panics if two `Ref`s are alive on the same thread —
# the precondition for the wait-graph cycle under contention. Downstream
# GD impls (e.g. botbowl-mcts) opt in via their dependency declaration so
# they get the assertion in `cargo test` debug builds; recon_mcts's own
# nim/2048 tests don't opt in because lib.rs's nim impl intentionally
# materialises Refs into a Vec, which is benign there.
lockref-guard = []

# A no-op since botbowl plan 070: every hashed container of the tree (children
# maps, parents sets, registry, visited sets) uses the fixed `FxBuildHasher`,
# so iteration order is the same in every process. It used to switch the
# children maps from `RandomState` to a fixed-seed SipHash for tests (plan 023,
# botbowl_rust); kept so the builds that name it still resolve.
deterministic_hash = []

# Tests are in a separate workspace so they can be compiled with feature
# `test_internals` by default.  Because the tests require a considerable amount
# of setup code which also serves as good api demonstration, this set-up allows
# the tests to have access to private functions (i.e. private when not compiled
# with `test_internals`) but also be included in the `rustdoc` documentation.
[workspace]
members = [".", "./tests/*"]
default-members = [".", "./tests/*"]

[profile.bench]
opt-level = 3
lto = "fat"
incremental = true
debug = 2
debug-assertions = true
overflow-checks = true
