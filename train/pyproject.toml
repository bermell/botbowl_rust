[project]
name = "bbnn"
version = "0.1.0"
description = "PyTorch trainer + ONNX export for the Blood Bowl MCTS value/policy net (plan 017)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "onnx>=1.16",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbnn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
